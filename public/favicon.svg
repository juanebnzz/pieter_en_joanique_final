<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- P & J monogram: espresso serif on linen, with a cinnamon ampersand -->
  <rect width="64" height="64" fill="#F8F7F3"/>
  <text x="32" y="45" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-weight="500" font-size="36" fill="#302E2C" letter-spacing="-1">P<tspan fill="#875F45" font-size="22" font-style="italic" dy="-1">&amp;</tspan><tspan dy="1">J</tspan></text>
</svg>
